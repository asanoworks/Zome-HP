<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="atelier Rhombusへのお問い合わせはこちらから。"
  >

  <title>Contact | atelier Rhombus</title>

  <link rel="icon" type="image/png" href="images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Header -->
  <!-- Header -->
<header class="header">

  <a class="header-logo" href="index.html">
    atelier Rhombus
  </a>

  <button
    class="menu-button"
    type="button"
    aria-label="メニューを開く"
    aria-expanded="false"
    aria-controls="global-nav"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav
    class="global-nav"
    id="global-nav"
    aria-label="メインナビゲーション"
  >
    <ul>
      <li><a href="index.html#zome">About Zome</a></li>
      <li><a href="index.html#works">Works</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

</header>


  <main>

    <!-- Contact Intro -->
    <section class="zome-intro">
      <div class="section-inner">

        <p class="section-label">
          CONTACT
        </p>

        <h1>
          Contact
        </h1>

        <p class="zome-lead">
          制作のご相談、ご依頼などお気軽にお問い合わせください。
        </p>

      </div>
    </section>


    <!-- Contact Form -->
    <section class="contact-section contact-page">
      <div class="section-inner">

        <form
         class="contact-form"
         action="https://formspree.io/f/xdenbwvn"
         method="POST"
>

          <div class="form-group">
            <label for="name">お名前</label>
            <input
              type="text"
              id="name"
              name="name"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input
              type="email"
              id="email"
              name="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="message">お問い合わせ内容</label>
            <textarea
              id="message"
              name="message"
              rows="8"
              required
            ></textarea>
          </div>

          <div class="form-submit">
            <button type="submit">
              Send
            </button>
          </div>

        </form>

      </div>
    </section>

  </main>


  <!-- Footer -->
  <footer class="footer">
    <div class="section-inner">

      <p class="footer-logo">
        atelier Rhombus
      </p>

      <p class="footer-copy">
        &copy; 2026 atelier Rhombus
      </p>

    </div>
  </footer>
<script>
  const menuButton = document.querySelector(".menu-button");
  const globalNav = document.querySelector(".global-nav");

  menuButton.addEventListener("click", () => {
    menuButton.classList.toggle("is-open");
    globalNav.classList.toggle("is-open");

    const isOpen = menuButton.classList.contains("is-open");
    menuButton.setAttribute("aria-expanded", isOpen);
  });
</script>
</body>
</html>
