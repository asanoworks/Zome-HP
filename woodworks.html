<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="atelier Rombusの木工作品をご紹介します。"
  >

  <title>Woodworks | atelier Rombus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">

      <a href="index.html" class="logo">
        atelier Rombus
      </a>

      <nav class="nav">
        <a href="index.html#about">About</a>
        <a href="index.html#works">Works</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>
  </header>


  <main>

    <!-- Woodworks Intro -->
    <section class="zome-intro">
      <div class="section-inner">

        <p class="section-label">
          WOODWORKS
        </p>

        <h1>
          Woodworks
        </h1>

        <p class="zome-lead">
          木の個性を活かし、暮らしの中に残るかたちへ。
        </p>

        <p class="zome-text">
          atelier Rombusでは、木という素材の表情や特徴を活かしながら、
          家具や照明、空間を彩る木工作品を制作しています。
        </p>

      </div>
    </section>


    <!-- Woodworks Gallery -->
    <section class="zome-gallery">
      <div class="section-inner">

        <!-- 01 テーブル・照明 -->
        <div class="woodworks-pair">

          <div class="woodworks-item">
            <img
              src="images/woodworks/woodworks1.jpg"
              alt="木製テーブル"
            >
          </div>

          <div class="woodworks-item">
            <img
              src="images/woodworks/woodworks2.jpg"
              alt="木を使った照明作品"
            >
          </div>

        </div>


        <!-- 02 建築空間 -->
        <div class="gallery-wide">
          <img
            src="images/woodworks/woodworks3.jpg"
            alt="木工を取り入れた建築空間"
          >
        </div>


        <!-- 03 木組み・ディテール -->
        <div class="gallery-wide">
          <img
            src="images/woodworks/woodworks4.jpeg"
            alt="幾何学模様の木工作品"
          >
        </div>

      </div>
    </section>

  </main>


  <!-- Footer -->
  <footer class="footer">
    <div class="section-inner">

      <p class="footer-logo">
        atelier Rombus
      </p>

      <p class="footer-copy">
        &copy; 2026 atelier Rombus
      </p>

    </div>
  </footer>

</body>
</html>
