<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="atelier Rombusの茅葺き作品をご紹介します。"
  >

  <title>Kayabuki | atelier Rombus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">

    <a class="header-logo" href="index.html">
  atelier Rombus
</a>

    <button
      class="menu-button"
      type="button"
      aria-label="メニューを開く"
      aria-expanded="false"
      aria-controls="global-nav"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      class="global-nav"
      id="global-nav"
      aria-label="メインナビゲーション"
    >
      <ul>
       <li><a href="index.html#zome">About Zome</a></li>
       <li><a href="index.html#works">Works</a></li>
       <li><a href="profile.html">Profile</a></li>
       <li><a href="contact.html">Contact</a></li>
     </ul>
    </nav>

  </header>


  <main>

    <!-- Kayabuki Intro -->
    <section class="zome-intro">
      <div class="section-inner">

        <p class="section-label">
          KAYABUKI
        </p>

        <h1>
          茅葺き
        </h1>

        <p class="zome-lead">
          自然素材が生み出す、やわらかな風景。
        </p>

        <p class="zome-text">
          atelier Rombusでは、伝統的な茅葺きの技術と、
          木や自然素材を活かしたものづくりを組み合わせ、
          周囲の風景に溶け込む空間をつくっています。
        </p>

      </div>
    </section>


    <!-- Kayabuki Gallery -->
    <section class="zome-gallery">
      <div class="section-inner">

        <!-- 01 茅葺きZome -->
        <div class="gallery-wide">
          <img
            src="images/kayabuki/kayabuki1.jpg"
            alt="茅葺きで仕上げられたZome建築"
          >
        </div>


        <!-- 02 茅葺きとZome -->
        <div class="gallery-wide">
          <img
            src="images/kayabuki/kayabuki2.jpg"
            alt="茅葺き建築と木組みのZome"
          >
        </div>

      </div>
    </section>

  </main>


  <!-- Footer -->
  <footer class="footer">
    <div class="section-inner">

      <p class="footer-logo">
        atelier Rombus
      </p>

      <p class="footer-copy">
        &copy; 2026 atelier Rombus
      </p>

    </div>
  </footer>
<script>
  const menuButton = document.querySelector(".menu-button");
  const globalNav = document.querySelector(".global-nav");

  menuButton.addEventListener("click", () => {
    menuButton.classList.toggle("is-open");
    globalNav.classList.toggle("is-open");

    const isOpen = menuButton.classList.contains("is-open");
    menuButton.setAttribute("aria-expanded", isOpen);
  });
</script>
</body>
</html>
